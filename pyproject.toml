[project]
name = "back"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.157.0,<0.158.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "fastapi-swagger-dark (>=0.0.9,<0.0.10)",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
lint.select = [
    "E",   # Pyflakes (errors)
    "F",   # Pyflakes (unused imports and other)
    "I",   # isort (sorting imports)
    "W",   # PEP 8 (style)
    "N",   # PEP 8 (naming)
    "D",   # pydocstyle (docstrings)
    "B",   # flake8-bugbear (potential bugs)
    "C4",  # flake8-comprehensions (optimization for comprehensions)
    "UP",  # Universal rules (f.e. f-strings)
]
lint.ignore = [
    # "W503",  # line break before binary operator (как у вас было в flake8)
    "N818",  # exception name should be named with an Error suffix
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D104",  # missing docstring in public package
    "D105",  # missing docstring in magic method
    "D107",  # Missing docstring in `__init__` method
    "UP017",  # Using datetime.UTC instead of timezone.utc
]
exclude = [
    ".git",
    "__pycache__",
    "conf",
    "venv",
    ".venv",
    ".vscode",
    ".idea",
    "migrations/versions",
]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]
"migrations/versions/*" = ["W291"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"
