services:
  api:
    build: 
      ./
    container_name: api-project
    environment:
      BASE_ROUTE_PATH: ${BASE_ROUTE_PATH-/api/v1}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8000:8000"
    networks:
      - back-network
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000${BASE_ROUTE_PATH-/api/v1}/openapi.json || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    
  db:
    image: postgres:16
    container_name: project_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    networks:
      - back-network
  
networks:
  back-network:

